<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="t d"><title id="t">Safe disconnection</title><desc id="d">The SMS and PastMaster retain their own records after disconnection.</desc><rect width="880" height="370" rx="26" fill="#f2fafb"/><g font-family="Arial,sans-serif"><text x="440" y="45" text-anchor="middle" font-size="25" font-weight="700" fill="#173b49">Disconnect the API, keep the records</text><rect x="45" y="78" width="280" height="235" rx="21" fill="#fff" stroke="#d4e3e7"/><rect x="555" y="78" width="280" height="235" rx="21" fill="#fff" stroke="#d4e3e7"/><text x="185" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#173b49">School SMS keeps</text><text x="695" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#173b49">PastMaster keeps</text><g fill="#36545f" font-size="15"><text x="82" y="166">✓ Student records</text><text x="82" y="204">✓ Official report cards</text><text x="82" y="242">✓ Cached intelligence</text><text x="82" y="280">✓ School passwords</text><text x="592" y="166">✓ Learner profiles</text><text x="592" y="204">✓ Practice attempts</text><text x="592" y="242">✓ Competency evidence</text><text x="592" y="280">✓ Learning history</text></g><rect x="377" y="143" width="126" height="88" rx="17" fill="#fff0e9" stroke="#edc8b9"/><path d="M399 188h27m28 0h27M429 171l22 34M451 171l-22 34" fill="none" stroke="#d9653b" stroke-width="5" stroke-linecap="round"/><text x="440" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#a94325">API disconnected</text></g></svg>

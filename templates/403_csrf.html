<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check Failed</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #0f172a;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(92vw, 560px);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }
        p {
            color: #475569;
            line-height: 1.6;
        }
        code {
            display: block;
            margin: 18px 0;
            padding: 12px;
            border-radius: 6px;
            background: #f1f5f9;
            color: #334155;
            white-space: normal;
        }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Security Check Failed</h1>
        <p>The login form expired or your browser did not send the security cookie. Reload the login page and try again.</p>
        <code>Reason: {{ reason|default:"CSRF verification failed" }}</code>
        <code>Host: {{ host }}</code>
        <a href="{{ retry_url }}">Reload Login</a>
    </main>
</body>
</html>

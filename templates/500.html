<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-lg w-full text-center">
            <div class="mb-8">
                <h1 class="text-9xl font-bold text-gray-200">500</h1>
                <div class="text-6xl mb-4">⚠️</div>
                <h2 class="text-3xl font-semibold text-gray-900 mb-3">Server Error</h2>
                <p class="text-gray-600 mb-8">Oops! Something went wrong on our end. We're working to fix it.</p>
            </div>
            <div class="space-y-3">
                <a href="/" class="inline-block bg-blue-600 text-white px-8 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                    Go to Homepage
                </a>
                <div>
                    <button onclick="location.reload()" class="text-blue-600 hover:text-blue-700 font-medium">
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

{% extends 'base.html' %}

{% block title %}Coverage Report{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg">
        <div class="px-6 py-4 border-b border-gray-200">
            <h3 class="text-2xl font-bold text-gray-900">Curriculum Coverage Report</h3>
            <p class="text-gray-600 mt-1">Select a curriculum and class to generate coverage report</p>
        </div>
        
        <div class="p-6">
            <form method="get" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Curriculum</label>
                    <select name="curriculum" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select Curriculum</option>
                        {% for curriculum in curricula %}
                        <option value="{{ curriculum.id }}" {% if request.GET.curriculum == curriculum.id|stringformat:"s" %}selected{% endif %}>
                            {{ curriculum.title }} ({{ curriculum.academic_year }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Class</label>
                    <select name="class" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select Class</option>
                        {% for class in classes %}
                        <option value="{{ class.id }}" {% if request.GET.class == class.id|stringformat:"s" %}selected{% endif %}>
                            {{ class.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg inline-flex items-center justify-center">
                    <i class="fas fa-chart-bar mr-2"></i> Generate Report
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

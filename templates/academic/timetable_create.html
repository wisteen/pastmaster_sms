{% extends 'base.html' %}
{% load static %}

{% block title %}Create Timetable Entry{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <div class="bg-white rounded-lg shadow-lg">
        <div class="bg-blue-600 text-white px-6 py-4 rounded-t-lg">
            <h3 class="text-xl font-semibold">Create Timetable Entry - {{ active_term.name }}</h3>
        </div>
        <div class="p-6">
            <form method="post">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="school_class" class="block text-sm font-medium text-gray-700 mb-2">Class <span class="text-red-500">*</span></label>
                        <select name="school_class" id="school_class" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">Select Class</option>
                            {% for class in classes %}
                            <option value="{{ class.id }}">{{ class.name }} {{ class.stream }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="time_slot" class="block text-sm font-medium text-gray-700 mb-2">Time Slot <span class="text-red-500">*</span></label>
                        <select name="time_slot" id="time_slot" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">Select Time Slot</option>
                            {% for slot in time_slots %}
                            <option value="{{ slot.id }}">
                                {% if slot.day_of_week == 0 %}Monday
                                {% elif slot.day_of_week == 1 %}Tuesday
                                {% elif slot.day_of_week == 2 %}Wednesday
                                {% elif slot.day_of_week == 3 %}Thursday
                                {% elif slot.day_of_week == 4 %}Friday
                                {% elif slot.day_of_week == 5 %}Saturday
                                {% elif slot.day_of_week == 6 %}Sunday
                                {% endif %}
                                - {{ slot.start_time|time:"H:i" }} to {{ slot.end_time|time:"H:i" }} ({{ slot.name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">Subject <span class="text-red-500">*</span></label>
                        <select name="subject" id="subject" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">Select Subject</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.code }} - {{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="teacher" class="block text-sm font-medium text-gray-700 mb-2">Teacher <span class="text-red-500">*</span></label>
                        <select name="teacher" id="teacher" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">Select Teacher</option>
                            {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">{{ teacher.user.get_full_name }} ({{ teacher.employee_id }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div>
                        <label for="room" class="block text-sm font-medium text-gray-700 mb-2">Room <span class="text-red-500">*</span></label>
                        <select name="room" id="room" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="">Select Room</option>
                            {% for room in rooms %}
                            <option value="{{ room.id }}">{{ room.room_name }} ({{ room.room_type }}) - Capacity: {{ room.capacity }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-3 mt-8">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-medium transition-colors">
                        <i class="fas fa-save mr-1"></i> Create Timetable Entry
                    </button>
                    <a href="{% url 'academic:timetable_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md font-medium transition-colors">
                        <i class="fas fa-arrow-left mr-1"></i> Back to List
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const submitBtn = form.querySelector('button[type="submit"]');
    
    form.addEventListener('submit', function(e) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Creating...';
        submitBtn.classList.add('opacity-50');
    });
});
</script>
{% endblock %}

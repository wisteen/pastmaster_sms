{% extends 'base.html' %}

{% block title %}Add Guardian{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Add Guardian for {{ student.user.get_full_name }}</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="grid grid-cols-2 gap-4">
                    {% for field in form %}
                    <div class="{% if field.name in 'home_address,office_address' %}col-span-2{% endif %}">
                        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="flex gap-4 mt-6">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                        Save Guardian
                    </button>
                    <a href="{% url 'student_biodata_view' student.id %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Control Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-700">
            <div class="bg-gradient-to-r from-red-600 to-red-700 px-8 py-6">
                <h2 class="text-3xl font-bold text-white text-center flex items-center justify-center gap-3">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    Feature Control
                </h2>
                <p class="text-red-100 text-center mt-2">System Administrator Access</p>
            </div>
            
            <div class="p-8">
                {% if messages %}
                    {% for message in messages %}
                    <div class="mb-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-900 text-red-100{% else %}bg-green-900 text-green-100{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label class="block text-gray-300 text-sm font-semibold mb-2">Phone Number</label>
                        <input type="text" name="phone" required 
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-red-500 focus:border-transparent"
                               placeholder="09125442676">
                    </div>
                    <div>
                        <label class="block text-gray-300 text-sm font-semibold mb-2">Password</label>
                        <input type="password" name="password" required 
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-red-500 focus:border-transparent"
                               placeholder="••••••••">
                    </div>
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-bold py-3 rounded-lg transition shadow-lg">
                        Access Control Panel
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a href="/" class="text-gray-400 hover:text-gray-300 text-sm">← Back to Main Site</a>
                </div>
            </div>
        </div>
        
        <div class="mt-4 text-center text-gray-500 text-xs">
            <p>⚠️ Authorized Personnel Only</p>
        </div>
    </div>
</body>
</html>

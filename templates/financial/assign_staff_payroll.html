{% extends 'base.html' %}
{% load static %}

{% block title %}Assign Staff Payroll{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fas fa-user-plus mr-2"></i>
        Assign Staff Payroll Structure
    </h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Staff Member</label>
            <select name="teacher_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">Select Staff</option>
                {% for teacher in teachers %}
                <option value="{{ teacher.id }}">{{ teacher.user.get_full_name }} ({{ teacher.employee_id }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Payroll Structure</label>
            <select name="payroll_structure_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">Select Structure</option>
                {% for structure in structures %}
                <option value="{{ structure.id }}">{{ structure.name }} (₦{{ structure.gross_salary|floatformat:0 }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
            <input type="month" name="month" value="{{ current_month|date:'Y-m' }}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium">
                <i class="fas fa-check mr-2"></i> Assign Payroll
            </button>
            <a href="{% url 'financial:payroll_management' %}" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-3 rounded-lg font-medium text-center">
                Cancel
            </a>
        </div>
    </form>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

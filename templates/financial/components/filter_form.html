<!-- Financial Filter Form Component -->
<div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
    <form method="get">
        <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <!-- Date Range Filter -->
            <div>
                <label for="date_from" class="block text-sm font-medium text-gray-700 mb-2">From Date</label>
                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       id="date_from" name="date_from" value="{{ request.GET.date_from }}">
            </div>
            <div>
                <label for="date_to" class="block text-sm font-medium text-gray-700 mb-2">To Date</label>
                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       id="date_to" name="date_to" value="{{ request.GET.date_to }}">
            </div>
            
            <!-- Status Filter -->
            {% if status_choices %}
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        id="status" name="status">
                    <option value="">All Status</option>
                    {% for value, label in status_choices %}
                    <option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            
            <!-- Amount Range Filter -->
            <div>
                <label for="amount_min" class="block text-sm font-medium text-gray-700 mb-2">Min Amount</label>
                <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       id="amount_min" name="amount_min" value="{{ request.GET.amount_min }}" step="0.01" min="0" placeholder="0.00">
            </div>
            <div>
                <label for="amount_max" class="block text-sm font-medium text-gray-700 mb-2">Max Amount</label>
                <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       id="amount_max" name="amount_max" value="{{ request.GET.amount_max }}" step="0.01" min="0" placeholder="999999.99">
            </div>
        </div>
        
        <!-- Search and Actions Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
                <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                <input type="search" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       id="search" name="search" value="{{ request.GET.search }}" placeholder="Search...">
            </div>
            <div class="flex items-end space-x-2">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-filter mr-1"></i> Apply Filters
                </button>
                <a href="{{ request.path }}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    <i class="fas fa-times mr-1"></i> Clear
                </a>
            </div>
        </div>
    </form>
</div>

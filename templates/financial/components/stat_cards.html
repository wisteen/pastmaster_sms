<!-- Financial Statistics Cards Component -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
    {% for stat in stats %}
    <div class="bg-{{ stat.type|default:'blue' }}-50 border border-{{ stat.type|default:'blue' }}-200 rounded-lg p-6">
        <div class="flex items-center">
            <i class="{{ stat.icon|default:'fas fa-chart-line' }} text-2xl text-{{ stat.type|default:'blue' }}-600 mr-4"></i>
            <div>
                <div class="text-sm text-{{ stat.type|default:'blue' }}-600">{{ stat.label }}</div>
                <div class="text-2xl font-bold text-{{ stat.type|default:'blue' }}-800">
                    {% if stat.is_currency %}
                        ₦{{ stat.value|floatformat:0 }}
                    {% else %}
                        {{ stat.value }}
                    {% endif %}
                </div>
                {% if stat.change %}
                <div class="text-sm text-{{ stat.change_type|default:'green' }}-600">
                    <i class="fas fa-arrow-{{ stat.change_direction|default:'up' }} mr-1"></i>
                    {{ stat.change }}%
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>

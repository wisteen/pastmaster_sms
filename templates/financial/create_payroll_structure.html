{% extends 'base.html' %}

{% block title %}Create Payroll Structure{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Create Payroll Structure</h1>
            <p class="text-gray-600 mt-1">Define salary structure for staff</p>
        </div>
        <a href="{% url 'financial:payroll_management' %}" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg flex items-center">
            <i class="fas fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Structure Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., Senior Staff">
                </div>
                
                <div>
                    <label for="basic_salary" class="block text-sm font-medium text-gray-700 mb-2">Basic Salary</label>
                    <input type="number" id="basic_salary" name="basic_salary" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="house_allowance" class="block text-sm font-medium text-gray-700 mb-2">House Allowance</label>
                    <input type="number" id="house_allowance" name="house_allowance" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="transport_allowance" class="block text-sm font-medium text-gray-700 mb-2">Transport Allowance</label>
                    <input type="number" id="transport_allowance" name="transport_allowance" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="medical_allowance" class="block text-sm font-medium text-gray-700 mb-2">Medical Allowance</label>
                    <input type="number" id="medical_allowance" name="medical_allowance" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="other_allowances" class="block text-sm font-medium text-gray-700 mb-2">Other Allowances</label>
                    <input type="number" id="other_allowances" name="other_allowances" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="tax_rate" class="block text-sm font-medium text-gray-700 mb-2">Tax Rate (%)</label>
                    <input type="number" id="tax_rate" name="tax_rate" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label for="pension_rate" class="block text-sm font-medium text-gray-700 mb-2">Pension Rate (%)</label>
                    <input type="number" id="pension_rate" name="pension_rate" step="0.01" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <a href="{% url 'financial:payroll_management' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center">
                    <i class="fas fa-save mr-2"></i>Create Structure
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

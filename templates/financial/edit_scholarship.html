{% extends 'base.html' %}

{% block title %}Edit Scholarship{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit Scholarship</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Scholarship Name</label>
                <input type="text" name="name" value="{{ scholarship.name }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                <select name="scholarship_type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="merit" {% if scholarship.scholarship_type == 'merit' %}selected{% endif %}>Merit Based</option>
                    <option value="need" {% if scholarship.scholarship_type == 'need' %}selected{% endif %}>Need Based</option>
                    <option value="sports" {% if scholarship.scholarship_type == 'sports' %}selected{% endif %}>Sports</option>
                    <option value="academic" {% if scholarship.scholarship_type == 'academic' %}selected{% endif %}>Academic Excellence</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Amount (₦)</label>
                <input type="number" name="amount" value="{{ scholarship.amount }}" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Percentage (%)</label>
                <input type="number" name="percentage" value="{{ scholarship.percentage }}" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Max Recipients</label>
                <input type="number" name="max_recipients" value="{{ scholarship.max_recipients }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Academic Year</label>
                <input type="text" name="academic_year" value="{{ scholarship.academic_year }}" placeholder="2024-2025" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea name="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">{{ scholarship.description }}</textarea>
            </div>
        </div>
        
        <div class="flex gap-4 mt-6">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">Update Scholarship</button>
            <a href="{% url 'financial:scholarship_management' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Forms Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/financial-forms.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Enhanced Financial Form Example</h5>
                    </div>
                    <div class="card-body">
                        <!-- Fee Structure Form Example -->
                        <form class="financial-form fee-structure-form" method="post">
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label for="id_name" class="required">Fee Structure Name</label>
                                <input type="text" name="name" class="form-control" id="id_name" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="id_tuition_fee" class="required">Tuition Fee</label>
                                        <input type="number" name="tuition_fee" class="form-control monetary-field" 
                                               id="id_tuition_fee" step="0.01" min="0" placeholder="0.00" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="id_development_fee">Development Fee</label>
                                        <input type="number" name="development_fee" class="form-control monetary-field" 
                                               id="id_development_fee" step="0.01" min="0" placeholder="0.00">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="id_exam_fee">Exam Fee</label>
                                        <input type="number" name="exam_fee" class="form-control monetary-field" 
                                               id="id_exam_fee" step="0.01" min="0" placeholder="0.00">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="id_library_fee">Library Fee</label>
                                        <input type="number" name="library_fee" class="form-control monetary-field" 
                                               id="id_library_fee" step="0.01" min="0" placeholder="0.00">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="id_sports_fee">Sports Fee</label>
                                        <input type="number" name="sports_fee" class="form-control monetary-field" 
                                               id="id_sports_fee" step="0.01" min="0" placeholder="0.00">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <div class="form-check">
                                    <input type="checkbox" name="is_active" class="form-check-input" id="id_is_active" checked>
                                    <label class="form-check-label" for="id_is_active">
                                        Active Fee Structure
                                    </label>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span class="htmx-indicator spinner-border spinner-border-sm me-2" style="display: none;"></span>
                                    Save Fee Structure
                                </button>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <!-- Scholarship Form Example -->
                        <form class="financial-form scholarship-form" method="post">
                            {% csrf_token %}
                            
                            <h6 class="text-muted mb-3">Scholarship Form Example</h6>
                            
                            <div class="form-group">
                                <label for="id_scholarship_name" class="required">Scholarship Name</label>
                                <input type="text" name="name" class="form-control" id="id_scholarship_name" required>
                            </div>
                            
                            <div class="amount-percentage-group">
                                <h6>Award Amount</h6>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="id_amount">Fixed Amount</label>
                                            <input type="number" name="amount" class="form-control monetary-field" 
                                                   id="id_amount" step="0.01" min="0" placeholder="0.00">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="id_percentage">Percentage</label>
                                            <input type="number" name="percentage" class="form-control percentage-field" 
                                                   id="id_percentage" step="0.01" min="0" max="100" placeholder="0.00">
                                        </div>
                                    </div>
                                </div>
                                <div class="mutual-exclusive-note">
                                    Note: Specify either a fixed amount or percentage, not both.
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="id_max_recipients">Maximum Recipients</label>
                                <input type="number" name="max_recipients" class="form-control" 
                                       id="id_max_recipients" min="1" value="1">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">
                                    <span class="htmx-indicator spinner-border spinner-border-sm me-2" style="display: none;"></span>
                                    Create Scholarship
                                </button>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <!-- Payment Form Example -->
                        <form class="financial-form payment-form" method="post">
                            {% csrf_token %}
                            
                            <h6 class="text-muted mb-3">Payment Form Example</h6>
                            
                            <div class="form-group">
                                <label for="id_student_fee" class="required">Student Fee</label>
                                <select name="student_fee" class="form-control" id="id_student_fee" required>
                                    <option value="">Select student fee...</option>
                                    <option value="1" data-balance="1500.00">John Doe - Term 1 Fees (Balance: $1,500.00)</option>
                                    <option value="2" data-balance="800.00">Jane Smith - Term 1 Fees (Balance: $800.00)</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="id_payment_amount" class="required">Payment Amount</label>
                                <input type="number" name="amount" class="form-control monetary-field" 
                                       id="id_payment_amount" step="0.01" min="0.01" placeholder="0.00" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="id_payment_method" class="required">Payment Method</label>
                                <select name="payment_method" class="form-control" id="id_payment_method" required>
                                    <option value="">Select payment method...</option>
                                    <option value="cash">Cash</option>
                                    <option value="bank_transfer">Bank Transfer</option>
                                    <option value="card">Card</option>
                                    <option value="online">Online</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="id_reference_number">Reference Number</label>
                                <input type="text" name="reference_number" class="form-control" 
                                       id="id_reference_number" placeholder="Enter reference number">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span class="htmx-indicator spinner-border spinner-border-sm me-2" style="display: none;"></span>
                                    Process Payment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="{% static 'js/financial.js' %}"></script>
</body>
</html>

<!-- AI Chat Widget -->
<div id="aiChatWidget" class="fixed bottom-2 sm:bottom-4 right-2 sm:right-4" style="z-index: 1000;">
    <!-- Chat Button -->
    <button id="chatToggle" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-full p-3 sm:p-4 shadow-lg hover:shadow-xl transition-all">
        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
    </button>
    
    <!-- Chat Window -->
    <div id="chatWindow" class="hidden fixed sm:absolute bottom-0 sm:bottom-16 left-0 sm:left-auto right-0 sm:right-0 w-full sm:w-96 h-[100vh] sm:h-[500px] bg-white sm:rounded-lg shadow-2xl flex flex-col" style="z-index: 1001;">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-3 sm:p-4 sm:rounded-t-lg flex justify-between items-center">
            <div class="flex items-center">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span class="font-semibold text-sm sm:text-base">AI Assistant</span>
            </div>
            <button id="chatClose" class="hover:bg-white/20 rounded p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Messages -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-2 sm:space-y-3">
            <div class="flex items-start">
                <div class="bg-gray-100 rounded-lg p-2 sm:p-3 max-w-[85%] sm:max-w-[80%]">
                    <p class="text-xs sm:text-sm text-gray-800">Hi! I'm your AI assistant. How can I help you today?</p>
                </div>
            </div>
        </div>
        
        <!-- Input -->
        <div class="border-t p-3 sm:p-4">
            <form id="chatForm" class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Type your message..." class="flex-1 border rounded-lg px-2 sm:px-3 py-2 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
                <button type="submit" class="bg-blue-600 text-white rounded-lg px-3 sm:px-4 py-2 hover:bg-blue-700 transition-colors">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const chatToggle = document.getElementById('chatToggle');
const chatWindow = document.getElementById('chatWindow');
const chatClose = document.getElementById('chatClose');
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const chatMessages = document.getElementById('chatMessages');
let conversationHistory = [];

chatToggle.addEventListener('click', () => {
    chatWindow.classList.toggle('hidden');
});

chatClose.addEventListener('click', () => {
    chatWindow.classList.add('hidden');
});

chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;
    
    addMessage(message, 'user');
    chatInput.value = '';
    
    const typingDiv = addTypingIndicator();
    
    try {
        const response = await fetch('{% url "core:ai_chat" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                message: message,
                history: conversationHistory
            })
        });
        
        const data = await response.json();
        typingDiv.remove();
        
        if (data.success) {
            addMessage(data.response, 'ai');
            conversationHistory.push({role: 'user', content: message});
            conversationHistory.push({role: 'assistant', content: data.response});
        } else {
            addMessage('Sorry, I encountered an error. Please try again.', 'ai');
        }
    } catch (error) {
        typingDiv.remove();
        addMessage('Sorry, I encountered an error. Please try again.', 'ai');
    }
});

function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = sender === 'user' ? 'flex justify-end' : 'flex items-start';
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `${sender === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800'} rounded-lg p-2 sm:p-3 max-w-[85%] sm:max-w-[80%]`;
    
    if (sender === 'ai') {
        // Render HTML for AI responses
        messageDiv.innerHTML = `<div class="text-xs sm:text-sm prose prose-sm max-w-none">${text}</div>`;
    } else {
        // Plain text for user messages
        const p = document.createElement('p');
        p.className = 'text-xs sm:text-sm';
        p.textContent = text;
        messageDiv.appendChild(p);
    }
    
    div.appendChild(messageDiv);
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
}

function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'flex items-start';
    div.innerHTML = `
        <div class="bg-gray-100 rounded-lg p-3">
            <div class="flex space-x-1">
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
        </div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
}
</script>

{% if global_advertisements %}
<section class="mb-5" aria-label="Platform announcements">
    <div class="grid gap-3 {% if global_advertisements|length > 1 %}lg:grid-cols-2{% endif %}">
        {% for ad in global_advertisements %}
        <article class="overflow-hidden rounded-xl border border-amber-200 bg-gradient-to-r from-amber-50 via-white to-orange-50 shadow-sm">
            <div class="grid h-full {% if ad.image %}sm:grid-cols-[9rem_minmax(0,1fr)]{% endif %}">
                {% if ad.image %}<img src="{{ ad.image.url }}" alt="" class="h-36 w-full object-cover sm:h-full sm:min-h-32">{% endif %}
                <div class="flex h-full flex-col justify-center p-4 sm:p-5">
                    <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-amber-700">Sponsored</p>
                    <h2 class="mt-1 text-base font-bold text-slate-950">{{ ad.title }}</h2>
                    {% if ad.message %}<p class="mt-1 text-sm leading-5 text-slate-600">{{ ad.message|linebreaksbr }}</p>{% endif %}
                    {% if ad.destination_url %}<a href="{{ ad.destination_url }}" target="_blank" rel="noopener noreferrer sponsored" class="mt-3 inline-flex w-fit items-center rounded-lg bg-slate-950 px-3 py-2 text-xs font-bold text-white hover:bg-slate-800">{{ ad.button_label|default:'Learn more' }}<i class="fas fa-arrow-up-right-from-square ml-2" aria-hidden="true"></i></a>{% endif %}
                </div>
            </div>
        </article>
        {% endfor %}
    </div>
</section>
{% endif %}

{% extends 'base.html' %}
{% load static %}

{% block title %}Add Digital Resource{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6 max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-plus-circle mr-2"></i>Add Digital Resource
        </h2>
        <a href="{% url 'digital_resources' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">
            <i class="fas fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input type="text" name="title" required class="w-full border border-gray-300 rounded-md px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="4" class="w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Resource Type *</label>
                <select name="resource_type" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                    <option value="">Select Type</option>
                    <option value="pdf">PDF Document</option>
                    <option value="video">Video</option>
                    <option value="audio">Audio</option>
                    <option value="link">External Link</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                <select name="category" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                    <option value="">Select Category</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Access Level *</label>
            <select name="access_level" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                <option value="students">Students</option>
                <option value="teachers">Teachers</option>
                <option value="public">Public</option>
                <option value="restricted">Restricted</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Upload File</label>
            <input type="file" name="file" class="w-full border border-gray-300 rounded-md px-3 py-2">
            <p class="text-xs text-gray-500 mt-1">Upload a file or provide a URL below</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">External URL</label>
            <input type="url" name="url" placeholder="https://example.com/resource" class="w-full border border-gray-300 rounded-md px-3 py-2">
            <p class="text-xs text-gray-500 mt-1">Provide a URL if not uploading a file</p>
        </div>

        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'digital_resources' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg">Cancel</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>Add Resource
            </button>
        </div>
    </form>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

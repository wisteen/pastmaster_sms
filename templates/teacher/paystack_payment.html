{% extends 'base.html' %}
{% block title %}Payment{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow p-8 text-center">
        <h2 class="text-2xl font-bold mb-4">Complete Payment</h2>
        <p class="text-gray-600 mb-6">Click the button below to pay ₦500 for 7 days AI access</p>
        
        <button id="payButton" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-semibold">
            Pay ₦500 with Paystack
        </button>
    </div>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
document.getElementById('payButton').addEventListener('click', function() {
    var handler = PaystackPop.setup({
        key: '{{ paystack_public_key }}',
        email: '{{ email }}',
        amount: {{ amount }},
        currency: 'NGN',
        ref: '{{ reference }}',
        callback: function(response) {
            window.location.href = '/teacher/verify-payment/?reference=' + response.reference;
        },
        onClose: function() {
            alert('Payment cancelled');
        }
    });
    handler.openIframe();
});
</script>
{% endblock %}

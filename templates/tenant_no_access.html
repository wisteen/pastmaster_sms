<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Access Required</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow p-8 text-center">
        <div class="mx-auto mb-4 h-12 w-12 rounded-full bg-red-100 flex items-center justify-center text-red-600">
            <span class="text-2xl font-bold">!</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Access not available</h1>
        <p class="text-gray-600 mb-6">
            Your account is not linked to {% if school %}{{ school.name }}{% else %}this school portal{% endif %}.
        </p>
        <a href="{% url 'core:login' %}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded font-semibold">
            Sign in again
        </a>
    </div>
</body>
</html>
